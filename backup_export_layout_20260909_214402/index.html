<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSP, Akbari Lab</title>
<link rel="stylesheet" href="vendor/uplot/uPlot.min.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Cpath d=%27M1 11 L4 5 L6 9 L8 3 L11 12 L13 7 L15 9%27 fill=%27none%27 stroke=%27%230b62a4%27 stroke-width=%271.6%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>DSP</h1>
  <span class="note">Akbari Lab</span>
  <span class="sp">
    <a href="test.html">Checks</a>
    <button id="theme">Dark</button>
  </span>
</header>

<div class="cols">

  <aside class="rail">

    <div id="drop" tabindex="0" role="button">
      Drop .mat files here, or click to choose
      <input type="file" id="picker" accept=".mat" multiple hidden>
    </div>

    <section id="filesPanel" class="hide">
      <h2>Files <span class="sp"><button id="clearFiles">Clear</button></span></h2>
      <div class="in">
        <div id="fileMsgs"></div>
        <div class="sx"><table id="fileTable"></table></div>
      </div>
    </section>

    <section id="settingsPanel" class="hide">
      <h2>Settings</h2>
      <div class="in">
        <div class="fields">
          <div>
            <label for="eventTime">Baseline anchor (min)</label>
            <input id="eventTime" type="number" step="0.1" value="1">
          </div>
          <div>
            <label for="exposure">Camera exposure (ms)</label>
            <input id="exposure" type="number" step="1" value="10">
          </div>
          <div>
            <label for="hiThr">Artifact cutoff, high</label>
            <input id="hiThr" type="number" step="1000" value="40000">
          </div>
          <div>
            <label for="loThr">Artifact cutoff, low</label>
            <input id="loThr" type="number" step="50" value="-950">
          </div>
        </div>
        <div class="run">
          <button id="run" class="go">Analyse</button>
          <span id="runStatus" class="dim"></span>
        </div>
      </div>
    </section>

  </aside>

  <main class="work">

    <p id="blank" class="blank">Results appear here.</p>

    <section id="resultsPanel" class="hide">
      <h2>Results <span class="sp">
        <button id="dlPng">Save plot</button>
      </span></h2>
      <div class="in">
        <div class="downloads" aria-label="Download CSV files">
          <button id="dlData">Raw data CSV</button>
          <button id="dlProcessed">Processed data CSV</button>
          <button id="dlCsv">Summary CSV</button>
        </div>
        <p class="download-note">Raw data includes every recorded frame. Processed data and summaries use the analysis settings.</p>
        <div id="resultMsgs"></div>
        <div class="sx"><table id="summary"></table></div>
      </div>
    </section>

    <section id="groupsPanel" class="hide">
      <h2>Groups <span class="sp">
        <button id="dlGrpStats">Stats CSV</button><button id="dlGrpTrace">Traces CSV</button><button id="dlGrpCmp">Comparison CSV</button>
      </span></h2>
      <div class="in">
        <div id="groupMsgs"></div>
        <div class="split">
          <div class="sx"><table id="groupTable"></table></div>
          <div>
            <div class="row" id="cmpRow">
              <label for="cmpA">Compare</label>
              <select id="cmpA"></select>
              <span class="dim">with</span>
              <select id="cmpB"></select>
            </div>
            <div class="sx"><table id="statsTable"></table></div>
            <p class="h" id="statsNote"></p>
          </div>
        </div>
      </div>
    </section>

    <section id="chartsPanel" class="hide">
      <h2>Plots <span class="sp"><span class="row" id="animalTabs"></span></span></h2>
      <div class="in">
        <div class="row" id="metricTabs"></div>
        <div class="plots" id="charts"></div>
      </div>
    </section>

    <section id="figPanel" class="hide">
      <h2>Figure <span class="sp">
        <button id="dlSvg">SVG</button><button id="dlPngHi">PNG</button>
      </span></h2>
      <div class="in">
        <div class="fields">
          <div>
            <label for="figWidth">Width</label>
            <select id="figWidth">
              <option value="85">85 mm, single column</option>
              <option value="114">114 mm, 1.5 column</option>
              <option value="170">170 mm, double column</option>
            </select>
          </div>
          <div>
            <label for="figHeight">Panel height (mm)</label>
            <input id="figHeight" type="number" step="2" min="14" max="90" value="32">
          </div>
          <div>
            <label for="figFont">Font size (pt)</label>
            <input id="figFont" type="number" step="0.5" min="5" max="12" value="7">
          </div>
          <div>
            <label for="figLine">Line width (pt)</label>
            <input id="figLine" type="number" step="0.25" min="0.25" max="2" value="0.75">
          </div>
          <div>
            <label for="figDpi">PNG resolution</label>
            <select id="figDpi">
              <option value="300">300 dpi</option>
              <option value="600" selected>600 dpi</option>
              <option value="1200">1200 dpi</option>
            </select>
          </div>
          <div>
            <label>Options</label>
            <label class="cb"><input type="checkbox" id="figGrey"> Greyscale</label>
            <label class="cb"><input type="checkbox" id="figGrid"> Gridlines</label>
            <label class="cb"><input type="checkbox" id="figShared" checked> Shared x axis</label>
            <label class="cb" id="figGroupsWrap" hidden><input type="checkbox" id="figGroups"> Group mean ± SEM</label>
          </div>
        </div>
        <div class="row panels"><span class="dim">Panels</span><span class="row" id="figPanels"></span></div>
        <div id="figPreview" class="figbox"></div>
        <p class="h" id="figSize"></p>
      </div>
    </section>

  </main>

</div>

<script src="vendor/uplot/uPlot.iife.min.js"></script>
<script src="vendor/h5wasm/h5wasm.js"></script>
<script src="js/spline.js"></script>
<script src="js/pipeline.js"></script>
<script src="js/groups.js"></script>
<script src="js/matfile.js"></script>
<script src="js/charts.js"></script>
<script src="js/figure.js"></script>
<script src="js/analysis.js"></script>
<script src="js/app.js"></script>
</body>
</html>
